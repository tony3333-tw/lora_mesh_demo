[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lora-mesh-client"
version = "0.2.2"
description = "Python client for lora_mesh: Meshtastic messages and node data over MQTT"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["paho-mqtt>=2.0"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["lora_mesh_client"]
